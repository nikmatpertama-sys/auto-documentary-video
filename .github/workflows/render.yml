name: Hybrid Documentary Generator

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Documentary topic / idea (English or Indonesian)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: documentary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HOME: ${{ github.workspace }}/.hf-cache
      HF_HUB_DOWNLOAD_TIMEOUT: "60"
      HF_HUB_ETAG_TIMEOUT: "20"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Find and extract newest valid project ZIP (filename-independent)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYZIP'
          import json
          import os
          import stat
          import subprocess
          import zipfile
          from pathlib import Path, PurePosixPath

          ROOT = Path.cwd().resolve()
          MARKERS = {
              "quota_router.py",
              "ai_router.py",
              "visual_matcher.py",
              "visual_fallback.py",
              "footage.py",
          }

          def safe_parts(filename):
              normalized = filename.replace("\\", "/")
              path = PurePosixPath(normalized)
              if path.is_absolute() or not path.parts or ".." in path.parts:
                  return None
              if any(part in ("", ".") for part in path.parts):
                  return None
              return path.parts

          def project_prefix(zf):
              regular_files = set()
              entries = []
              for info in zf.infolist():
                  if info.is_dir():
                      continue
                  parts = safe_parts(info.filename)
                  if parts is None:
                      continue
                  regular_files.add(parts)
                  entries.append((info, parts))

              prefixes = []
              for parts in regular_files:
                  if parts[-1] != "main.py":
                      continue
                  prefix = parts[:-1]
                  if prefix + ("requirements.txt",) not in regular_files:
                      continue
                  if not any(prefix + (marker,) in regular_files for marker in MARKERS):
                      continue
                  # The 10.15 project has this exact test module. Requiring it
                  # prevents log/media ZIPs from being mistaken for project ZIPs.
                  if prefix + ("quota_router.py",) in regular_files:
                      if prefix + ("test_quota_router.py",) not in regular_files:
                          continue
                  prefixes.append(prefix)

              if not prefixes:
                  return None
              return min(prefixes, key=lambda value: (len(value), value))

          def last_commit_timestamp(path):
              result = subprocess.run(
                  ["git", "log", "-1", "--format=%ct", "--", str(path)],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              try:
                  return int(result.stdout.strip())
              except (TypeError, ValueError):
                  return int(path.stat().st_mtime)

          candidates = []
          for archive in ROOT.iterdir():
              if not archive.is_file() or archive.suffix.lower() != ".zip":
                  continue
              try:
                  with zipfile.ZipFile(archive) as zf:
                      prefix = project_prefix(zf)
                      if prefix is not None:
                          candidates.append((last_commit_timestamp(archive), archive.stat().st_mtime_ns, archive.name, prefix))
              except (zipfile.BadZipFile, OSError, RuntimeError):
                  continue

          if not candidates:
              print("No valid project ZIP found. Existing repository project files will be used.")
              Path(".upgrade_zip_to_remove").unlink(missing_ok=True)
              raise SystemExit(0)

          candidates.sort(reverse=True)
          _, _, archive_name, prefix = candidates[0]
          archive = ROOT / archive_name
          print(f"Selected newest valid project archive: {archive_name}")

          copied = 0
          with zipfile.ZipFile(archive) as zf:
              for info in zf.infolist():
                  if info.is_dir():
                      continue
                  parts = safe_parts(info.filename)
                  if parts is None or parts[:len(prefix)] != prefix:
                      continue
                  relative_parts = parts[len(prefix):]
                  if not relative_parts:
                      continue

                  # Keep the workflow permanently stored in the repository.
                  if relative_parts[0] in (".github", ".git"):
                      continue

                  # Reject symlinks instead of writing them into the workspace.
                  unix_mode = (info.external_attr >> 16) & 0o170000
                  if unix_mode == stat.S_IFLNK:
                      raise RuntimeError(f"Project ZIP contains a symlink: {info.filename}")

                  target = ROOT.joinpath(*relative_parts).resolve()
                  target.relative_to(ROOT)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(zf.read(info))
                  copied += 1

          required = (
              "main.py",
              "quota_router.py",
              "render.py",
              "footage.py",
              "requirements.txt",
              "test_quota_router.py",
          )
          missing = [name for name in required if not (ROOT / name).is_file()]
          if missing:
              raise RuntimeError("Extracted ZIP is missing required 10.15 files: " + ", ".join(missing))

          # The next step deletes only the selected source ZIP, after extraction.
          Path(".upgrade_zip_to_remove").write_text(archive_name, encoding="utf-8")
          print(f"Extracted {copied} project files. ZIP source will be deleted after extraction is installed.")
          PYZIP

      - name: Remove source ZIP and commit extracted project files
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .upgrade_zip_to_remove ]]; then
            python - <<'PYREMOVE'
          from pathlib import Path
          import zipfile

          marker = Path(".upgrade_zip_to_remove")
          name = marker.read_text(encoding="utf-8").strip()
          archive = Path(name)
          if archive.parent != Path(".") or archive.suffix.lower() != ".zip":
              raise RuntimeError("Refusing to delete an unexpected ZIP path.")
          if not archive.is_file():
              raise RuntimeError(f"Selected project ZIP no longer exists: {name}")
          with zipfile.ZipFile(archive) as zf:
              if zf.testzip() is not None:
                  raise RuntimeError("Selected ZIP failed its integrity check before deletion.")
          archive.unlink()
          marker.unlink()
          print(f"Deleted source ZIP after successful extraction: {name}")
          PYREMOVE

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # Do not allow a ZIP update to overwrite this permanent workflow.
            git restore --source=HEAD -- .github/workflows/render.yml
            git add -A
            if git diff --cached --quiet; then
              echo "No extracted project changes to commit."
            else
              git commit -m "Install newest documentary generator project ZIP"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          else
            echo "No project ZIP was extracted; no ZIP deletion or project commit is needed."
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore SigLIP model cache
        uses: actions/cache@v6
        with:
          path: .hf-cache
          key: siglip-${{ runner.os }}-python311-siglip-sentencepiece-v3
          restore-keys: |
            siglip-${{ runner.os }}-python311-

      - name: Restore footage and thumbnail cache
        uses: actions/cache@v6
        with:
          path: .api-cache
          key: footage-api-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            footage-api-${{ runner.os }}-

      - name: Verify runtime and quota router
        run: |
          python -m py_compile main.py quota_router.py render.py footage.py test_quota_router.py
          python -m unittest -v test_quota_router

      - name: Generate documentary
        env:
          INPUT_TOPIC: ${{ inputs.topic }}

          # Existing provider credentials retained from the old workflow.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

          # Optional numbered provider API keys. Empty secrets are ignored by the project.
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          OPENROUTER_API_KEY_1: ${{ secrets.OPENROUTER_API_KEY_1 }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
          OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
          OPENROUTER_API_KEY_5: ${{ secrets.OPENROUTER_API_KEY_5 }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}

          # Cloudflare: primary account credentials and the additional key/account pair.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TK1: ${{ secrets.CF_API_TK1 }}
          CF_ID1: ${{ secrets.CF_ID1 }}

          # Speechify is the primary voice-over provider.
          SPVO_API: ${{ secrets.SPVO_API }}
          SPVO_API_1: ${{ secrets.SPVO_API_1 }}
          SPVO_API_2: ${{ secrets.SPVO_API_2 }}
          SPVO_API_3: ${{ secrets.SPVO_API_3 }}
          SPEECHIFY_API_KEY: ${{ secrets.SPEECHIFY_API_KEY }}
          SPEECHIFY_MODEL: simba-3.5
          SPEECHIFY_VOICE_ID: ${{ secrets.SPEECHIFY_VOICE_ID }}

          # Existing footage API credentials retained.
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}

          # Optional quota-scope labels/IDs. Leave defaults when keys share one account/project.
          GROQ_QUOTA_GROUP: shared-organization
          OPENROUTER_QUOTA_GROUP: shared-account
          GEMINI_PROJECT_ID: ${{ secrets.GEMINI_PROJECT_ID }}
          SPEECHIFY_QUOTA_GROUP: shared-account

          # Quota-aware router chooses eligible providers dynamically; no fixed key order is set.
          GROQ_MODEL: openai/gpt-oss-120b
          GEMINI_MODEL: gemini-3.8-flash
          GEMINI_VISION_MODEL: gemini-3.8-flash
          OPENROUTER_MODEL: openrouter/free
          OPENROUTER_VISION_MODEL: nvidia/nemotron-3.5-super-vl:free
          OPENROUTER_VISION_FALLBACK_MODEL: inclusionai/ling-3.2-flash:free
          CLOUDFLARE_CHAT_MODEL: "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
          CLOUDFLARE_VISION_MODEL: "@cf/meta/llama-3.2-11b-vision-instruct"

          # Visual verification remains enabled.
          FOOTAGE_VISION_REQUIRED: "true"
          FOOTAGE_VISION_MIN_CONFIDENCE: "0.72"
          FOOTAGE_VISION_CANDIDATE_LIMIT: "26"

          # Edge TTS is only the narration fallback when Speechify cannot complete VO.
          TTS_VOICE: en-US-GuyNeural
          TTS_RATE: "-4%"
          TTS_PITCH: "-3Hz"
          X264_PRESET: medium
        run: python main.py

      - name: Upload final video and diagnostic files
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hybrid-documentary-${{ github.run_number }}
          path: |
            documentary.mp4
            plan.json
            credits.txt
            timing.json
            stage_report.json
            failure_report.json
            production_report.json
            output/voiceover.mp3
            output/voiceover.wav
            output/captions.ass
            output/pipeline.log
          if-no-files-found: warn
          retention-days: 7

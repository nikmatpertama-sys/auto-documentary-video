name: Hybrid Documentary Generator

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Documentary topic / idea (English or Indonesian)"
        required: true
        type: string
  # Pushing to the ci-run branch renders ci-topic.txt without the Run-workflow
  # form, which is how an agent-driven run is started. It only publishes the
  # redacted diagnostics below, never application code.
  push:
    branches: [ci-run]

# Write access exists only so a ci-run run can publish its redacted reports to
# the ci-diagnostics branch for inspection. No step commits to project1 or main.
permissions:
  contents: write

concurrency:
  group: documentary-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Eight 1080x1920 x264 scenes plus a full re-encode of the final film can
    # exceed one hour on a shared runner. The job must fail on a real error, not
    # be killed by the clock before diagnostics can be produced.
    timeout-minutes: 120

    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HOME: ${{ github.workspace }}/.hf-cache
      HF_HUB_DOWNLOAD_TIMEOUT: "60"
      HF_HUB_ETAG_TIMEOUT: "20"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Apply bundled project upgrade for this run only
        shell: bash
        run: |
          set -euo pipefail
          # A bundled upgrade archive is applied to the workspace for this run
          # only. This step deliberately never commits or pushes: a render job
          # must not mutate the branch it is building from.
          mapfile -t candidates < <(
            find . -maxdepth 1 -type f \
              -regextype posix-extended \
              -regex './(auto-documentary-video-upgrade(\([0-9]+\)|-[0-9]+| \([0-9]+\))?|project1-10\.[0-9]+)\.zip' \
              -printf '%T@ %p\n' | sort -nr | cut -d' ' -f2-
          )
          if (( ${#candidates[@]} > 0 )); then
            UPGRADE_ZIP="${candidates[0]}"
            echo "Applying bundled upgrade $UPGRADE_ZIP to the workspace (no commit, no push)."
            python - "$UPGRADE_ZIP" <<'PYZIP'
          import sys, zipfile
          from pathlib import Path
          archive = Path(sys.argv[1])
          root = Path('.').resolve()
          with zipfile.ZipFile(archive) as z:
              for name in z.namelist():
                  (root / name).resolve().relative_to(root)
              z.extractall(root)
          print(f"Project upgrade package extracted from {archive.name} for this run only.")
          PYZIP
            rm -f "$UPGRADE_ZIP"
          else
            echo "No bundled upgrade ZIP found; using the checked-out repository files."
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"

      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --no-input -r requirements.txt
          python -m pip check
          python -m pip freeze > pip-freeze.txt

      - name: Restore SigLIP model cache
        uses: actions/cache@v6
        with:
          path: .hf-cache
          key: siglip-${{ runner.os }}-python311-siglip-sentencepiece-v3
          restore-keys: |
            siglip-${{ runner.os }}-python311-

      - name: Restore footage and thumbnail cache
        uses: actions/cache@v6
        with:
          path: .api-cache
          key: footage-api-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            footage-api-${{ runner.os }}-

      - name: Verify runtime and dependencies
        run: |
          set -euo pipefail
          ffmpeg -hide_banner -version | head -n 1
          ffprobe -hide_banner -version | head -n 1
          python -m py_compile main.py ai_router.py diagnostics.py visual_matcher.py visual_fallback.py healthcheck.py
          python -m unittest discover -s tests -v
          python healthcheck.py

      - name: Resolve documentary topic
        id: resolve-topic
        run: |
          set -euo pipefail
          TOPIC="${{ inputs.topic }}"
          if [ -z "${TOPIC// /}" ] && [ -f ci-topic.txt ]; then
            TOPIC="$(head -c 300 ci-topic.txt | tr '\n' ' ')"
          fi
          if [ -z "${TOPIC// /}" ]; then
            echo "No topic supplied." >&2
            exit 1
          fi
          echo "topic=$TOPIC" >> "$GITHUB_OUTPUT"
          echo "Run topic: $TOPIC"

      - name: Generate documentary
        env:
          INPUT_TOPIC: ${{ steps.resolve-topic.outputs.topic }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          # Free-tier only: DeepSeek draws on a prepaid balance and paid
          # OpenRouter slugs can bill, so both stay excluded unless this is
          # explicitly switched on.
          AI_ALLOW_PAID_PROVIDERS: "false"
          AI_TEXT_PROVIDER_ORDER: gemini,groq,openrouter
          AI_FACT_PROVIDER_ORDER: gemini,groq,openrouter
          AI_VISION_PROVIDER_ORDER: gemini,groq,openrouter
          GROQ_MODEL: openai/gpt-oss-120b
          GROQ_VISION_MODEL: qwen/qwen3.8-27b
          DEEPSEEK_MODEL: deepseek-flash
          # 3.8 Flash was answering 503 (high demand) on the free tier, while
          # 3.5 Flash-Lite has a much larger free daily request allowance.
          GEMINI_MODEL: gemini-3.5-flash-lite
          GEMINI_VISION_MODEL: gemini-3.5-flash-lite
          GEMINI_MODEL_FALLBACKS: gemini-3.8-flash,gemini-2.5-flash,gemini-2.0-flash
          # Groq's per-minute token window needs a full minute to recover.
          AI_RATE_LIMIT_COOLDOWN_SECONDS: "60"
          # Free-tier token ceiling for one request, and the window that must
          # pass before an oversized or truncated request can be retried.
          AI_TEXT_TOKEN_CEILING: "8000"
          AI_TPM_WINDOW_SECONDS: "60"
          # Bounded retry plan: four sweeps over the provider order with
          # exponential backoff, and up to ten minutes of waiting for a wait
          # the provider declared itself (Retry-After or an exhausted TPM
          # window). A rate-limited run now finishes instead of aborting.
          AI_ROUTER_MAX_PASSES: "4"
          AI_RETRY_BASE_SECONDS: "5"
          AI_RETRY_MAX_SECONDS: "60"
          AI_ROUTER_WAIT_BUDGET_SECONDS: "600"
          OPENROUTER_MODEL: openrouter/free
          OPENROUTER_VISION_MODEL: nvidia/nemotron-3.5-super-vl:free
          OPENROUTER_VISION_FALLBACK_MODEL: inclusionai/ling-3.2-flash:free
          FOOTAGE_VISION_REQUIRED: "true"
          FOOTAGE_VISION_MIN_CONFIDENCE: "0.72"
          FOOTAGE_VISION_CANDIDATE_LIMIT: "8"
          TTS_VOICE: en-US-GuyNeural
          TTS_RATE: "-4%"
          TTS_PITCH: "-3Hz"
          X264_PRESET: medium
        run: |
          set -o pipefail
          mkdir -p output
          python main.py 2>&1 | tee output/pipeline.log

      - name: Upload final video and production files
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hybrid-documentary-${{ github.run_number }}
          path: |
            documentary.mp4
            plan.json
            credits.txt
            timing.json
            production_report.json
            fact_check_report.json
            voiceover_manifest.json
            opening_layout.json
            stage_report.json
            pip-freeze.txt
            output/voiceover.mp3
            output/captions.ass
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: documentary-diagnostics-${{ github.run_number }}
          path: |
            failure_report.json
            stage_report.json
            production_report.json
            fact_check_report.json
            plan.json
            timing.json
            voiceover_manifest.json
            credits.txt
            opening_layout.json
            documentary.mp4
            output/pipeline.log
            output/captions.ass
            output/voiceover.mp3
            output/voiceover_manifest.json
            pip-freeze.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Print failure summary in the job log
        if: failure()
        run: |
          set +e
          for report in failure_report.json stage_report.json; do
            if [ -f "$report" ]; then
              echo "===== $report ====="
              python - "$report" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          if "failed_stage" in data:
              print("failed_stage:", data.get("failed_stage"))
              print("error_type:", data.get("error_type"))
              print("error_message:", data.get("error_message"))
          for item in (data.get("run") or {}).get("stages", []):
              print(f"  {item.get('stage')}: {item.get('status')} {item.get('duration_seconds')}s")
          PY
            fi
          done
          if [ -f output/pipeline.log ]; then
            echo "===== last 120 log lines ====="
            tail -n 120 output/pipeline.log
          fi

      - name: Publish redacted diagnostics for ci-run
        if: always() && github.ref_name == 'ci-run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PUBLISH=$(mktemp -d)
          if ! git clone --depth 1 --branch ci-diagnostics \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$PUBLISH" 2>/dev/null; then
            git clone --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$PUBLISH"
            git -C "$PUBLISH" checkout --orphan ci-diagnostics
            git -C "$PUBLISH" rm -rf . >/dev/null 2>&1 || true
          fi
          rm -rf "$PUBLISH/latest"
          mkdir -p "$PUBLISH/latest/output"
          for report in failure_report.json stage_report.json production_report.json \
              fact_check_report.json plan.json timing.json credits.txt \
              voiceover_manifest.json opening_layout.json; do
            [ -f "$report" ] && cp "$report" "$PUBLISH/latest/"
          done
          if [ -f output/pipeline.log ]; then
            tail -n 3000 output/pipeline.log > "$PUBLISH/latest/output/pipeline.log"
          fi
          if [ -f output/offline_render_evidence.json ]; then
            cp output/offline_render_evidence.json "$PUBLISH/latest/output/"
          fi
          printf 'run=%s\nsha=%s\nbranch=%s\njob_status=%s\n' \
            "${GITHUB_RUN_ID}" "${GITHUB_SHA}" "${GITHUB_REF_NAME}" \
            "${{ job.status }}" > "$PUBLISH/latest/RUN.txt"
          git -C "$PUBLISH" add -A
          git -C "$PUBLISH" -c user.name='documentary-ci' \
            -c user.email='ci@users.noreply.github.com' \
            commit -m "Diagnostics for run ${GITHUB_RUN_ID}" || {
              echo "Nothing to publish."
              exit 0
            }
          git -C "$PUBLISH" push origin HEAD:ci-diagnostics

name: Hybrid Documentary Generator

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Documentary idea / topic (English or Indonesian)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Restore SigLIP model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: siglip-${{ runner.os }}-google-siglip-base-patch16-256-multilingual-v1
          restore-keys: |
            siglip-${{ runner.os }}-

      - name: Restore footage source search cache
        uses: actions/cache@v4
        with:
          path: .api-cache
          key: footage-api-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            footage-api-${{ runner.os }}-

      - name: Generate documentary
        env:
          INPUT_TOPIC: ${{ inputs.topic }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          OPENROUTER_MODEL: openrouter/free
          TTS_VOICE: en-US-GuyNeural
          TTS_RATE: "-5%"
          TTS_PITCH: "-4Hz"
          GEMINI_MODEL: gemini-3.8-flash
        run: python main.py

      - name: Upload documentary and production notes
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-documentary-${{ github.run_number }}
          path: |
            documentary.mp4
            plan.json
            credits.txt
            output/voiceover.mp3
            output/captions.ass
          if-no-files-found: error
          retention-days: 7

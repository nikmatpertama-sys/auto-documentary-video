name: Provider Credential Wiring Check

# Answers one question with evidence instead of assumption: do the repository
# secrets actually reach the Python process? The job prints SET / MISSING and
# HTTP status codes only - never a credential value. The JSON report is
# committed to the `credential-status` branch so the result is readable without
# access to Actions logs.
on:
  workflow_dispatch:
  push:
    paths:
      - "tools/check_credentials.py"
      - ".github/workflows/credential-check.yml"

permissions:
  contents: write

concurrency:
  group: credential-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Report credential presence (names only)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_1: ${{ secrets.OPENROUTER_API_KEY_1 }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
          OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
          OPENROUTER_API_KEY_5: ${{ secrets.OPENROUTER_API_KEY_5 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_PROJECT_ID: ${{ secrets.GEMINI_PROJECT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TK1: ${{ secrets.CF_API_TK1 }}
          CF_ID1: ${{ secrets.CF_ID1 }}
          SPVO_API: ${{ secrets.SPVO_API }}
          SPVO_API_1: ${{ secrets.SPVO_API_1 }}
          SPVO_API_2: ${{ secrets.SPVO_API_2 }}
          SPVO_API_3: ${{ secrets.SPVO_API_3 }}
          SPEECHIFY_API_KEY: ${{ secrets.SPEECHIFY_API_KEY }}
          SPEECHIFY_VOICE_ID: ${{ secrets.SPEECHIFY_VOICE_ID }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          python tools/check_credentials.py --probe --json-out credential_status.json

      - name: Prove Speechify catalog access and real text-to-speech audio
        # Runs the same request body main.py sends for narration, decodes the
        # returned audio and measures it. Reports HTTP status and API error
        # codes only; the sample WAV is published so the audio can be played.
        continue-on-error: true
        env:
          SPVO_API: ${{ secrets.SPVO_API }}
          SPVO_API_1: ${{ secrets.SPVO_API_1 }}
          SPVO_API_2: ${{ secrets.SPVO_API_2 }}
          SPVO_API_3: ${{ secrets.SPVO_API_3 }}
          SPEECHIFY_API_KEY: ${{ secrets.SPEECHIFY_API_KEY }}
          SPEECHIFY_VOICE_ID: ${{ secrets.SPEECHIFY_VOICE_ID }}
          SPEECHIFY_MODEL: simba-3.5
        run: |
          set -euo pipefail
          python tools/speechify_tts_probe.py \
            --json-out speechify_tts_report.json \
            --sample-dir speechify_samples

      - name: Publish the redacted report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PUBLISH=$(mktemp -d)
          if ! git clone --depth 1 --branch credential-status \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$PUBLISH" 2>/dev/null; then
            git clone --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$PUBLISH"
            git -C "$PUBLISH" checkout --orphan credential-status
            git -C "$PUBLISH" rm -rf . >/dev/null 2>&1 || true
          fi
          rm -rf "$PUBLISH/latest"
          mkdir -p "$PUBLISH/latest"
          [ -f credential_status.json ] && cp credential_status.json "$PUBLISH/latest/"
          [ -f speechify_tts_report.json ] && cp speechify_tts_report.json "$PUBLISH/latest/"
          if [ -d speechify_samples ]; then
            mkdir -p "$PUBLISH/latest/speechify_samples"
            cp speechify_samples/*.wav "$PUBLISH/latest/speechify_samples/" 2>/dev/null || true
          fi
          printf 'run=%s\nsha=%s\nbranch=%s\njob_status=%s\n' \
            "${GITHUB_RUN_ID}" "${GITHUB_SHA}" "${GITHUB_REF_NAME}" \
            "${{ job.status }}" > "$PUBLISH/latest/RUN.txt"
          git -C "$PUBLISH" add -A
          git -C "$PUBLISH" -c user.name='credential-check' \
            -c user.email='credential-check@users.noreply.github.com' \
            commit -m "credential wiring report for run ${GITHUB_RUN_ID}" || true
          git -C "$PUBLISH" push origin HEAD:credential-status
